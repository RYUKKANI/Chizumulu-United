or(const k of ['baseline','includeInStats','captain','motm','returned','confirmed'])if(k in r&&typeof r[k]!=='boolean')throw Error('기록 상태 형식을 확인해 주세요.');for(const f of x.fixtures)if(f.scheduleHistory){let h;try{h=JSON.parse(f.scheduleHistory);}catch(e){throw Error('연기 이력 형식을 확인해 주세요.');}if(!Array.isArray(h)||h.length>5000||h.some(e=>!e||!['Postponed','Rescheduled','Date Updated'].includes(e.action)||!validDay(e.oldDate)||!validDay(e.newDate)||typeof e.reason!=='string'))throw Error('연기 이력 형식을 확인해 주세요.');}for(const roster of Object.values(x.lineups)){if(!Array.isArray(roster)||roster.some(r=>!r||!ids.has(r.playerId)||!['Starter','Sub','Unused'].includes(r.role)||typeof r.captain!=='boolean'||typeof r.travel!=='boolean'))throw Error('경기 명단 형식을 확인해 주세요.');}validateClubData(x);return true;}

function openPlayer(id=''){const p=id?{...getPlayer(id),nationality:getPlayer(id).nationality||'Malawi'}:{nationality:'Malawi',id:nextPlayerId(),status:'Active',position:'MF',contractType:'Unknown',registration:'Unknown',availability:'Unknown',identity:'Unknown',contractSigned:'Unknown',medical:'Unknown',emergency:'Unknown'};initializePlayerContractDates(p);photoDraft={photo:p.photo||'',busy:false};const group=[['기본 정보',['id','number','name','koreanName','position','status','leadership','birthDate','nationality','foot','height','weight','dayJob']],['계약·등록',['contractType','parentClub','nationalTeam','joinDate','contractStart','contractEnd','registration','registrationNo']],['가용 상태·서류',['availability','returnDate','identity','contractSigned','medical','emergency','notes']]];modal(id?'선수 정보 수정':'신규 선수 등록',`<form id="player-form" data-id="${esc(id)}"><div class="dialogbody"><div class="formerror" id="form-error" role="alert"></div>${photoEditor(p)}<section class="movement-options"><div class="field"><label for="movement-date">변동 기록일</label><input id="movement-date" name="movementDate" type="date" value="${esc(id?today():p.joinDate||today())}" required><span class="help">이 저장에서 생기는 변경 이력에 적용됩니다.</span></div></section>${group.map(([title,keys])=>`<section class="formsection"><h3>${title}</h3><div class="formgrid">${keys.map(k=>k==='id'?fixedPlayerId(p):k==='contractStart'?playerContractStartField(p):fieldHtml(pFields.find(f=>f[0]===k),p[k],['id','name','position','status'].includes(k),k==='id'?'readonly':'')).join('')}</div></section>`).join('')}</div><div class="dialogfoot">${btn('취소','close-dialog','close')}<button class="btn primary" type="submit">${icon('save')}선수 정보 저장</button></div></form>`,'','선수 ID로 경기·훈련·서류 기록을 연결합니다.');}
function nextPlayerId(){let n=Math.max(0,...state.players.map(p=>Number(p.id.match(/^CU26-(\d+)$/)?.[1]||0)))+1;return 'CU26-'+String(n).padStart(3,'0')}
function profile(id){const p=getPlayer(id),s=statsFor(id);const details=keys=>`<dl class="details">${keys.map(k=>{const f=pFields.find(f=>f[0]===k);return `<div class="detail"><dt>${f[1]}</dt><dd>${f[2]==='select'?badge(p[k]):esc(p[k]||'미입력')}</dd></div>`}).join('')}</dl>`;modal('선수 상세 정보',`<div class="dialogbody"><div class="profilehead">${avatar(p)}<div><h2>${esc(p.name)}</h2><p>${esc(p.koreanName||'한글 이름 미입력')} · ${esc(p.id)} · NO. ${esc(p.number||'—')}</p><div class="profilebadges"><span class="position">${esc(p.position)}</span>${badge(p.status)}${p.leadership?badge(p.leadership,'blue'):''}${badge(p.availability)}</div></div></div><div class="profilemetrics">${[['출전',s.apps],['선발',s.starts],['득점',s.goals],['도움',s.assists],['MOM',s.motm]].map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('')}</div><section class="formsection"><h3>기본 정보</h3>${details(['birthDate','nationality','foot','height','weight','nationalTeam','dayJob'])}</section><section class="formsection"><h3>계약·등록</h3>${details(['contractType','parentClub','joinDate','contractStart','contractEnd','registration','registrationNo','returnDate'])}</section><section class="formsection"><h3>서류 확인</h3>${details(['identity','contractSigned','medical','emergency'])}</section><section class="formsection"><h3>최근 기록</h3><p class="detailnote">훈련 기록 ${state.training.filter(r=>r.playerId===id).length}개 · 문서 ${state.documents.filter(r=>r.playerId===id).length}개 · 수상 ${state.awards.filter(r=>r.playerId===id).length}개</p>${state.moves.filter(m=>m.playerId===id).map(m=>`<p class="detailnote">${esc(m.date||'일자 미입력')} · ${esc(t(m.type))} · ${esc(m.from||'—')} → ${esc(m.to||'—')}</p>`).join('')}<p class="detailnote">${esc(p.notes||s.notes||'비고 없음')}</p></section></div>`,`<div class="dialogfoot">${btn('닫기','close-dialog','close')}${btn('선수 정보 수정','edit-player','edit',`data-id="${esc(id)}"`,'primary')}</div>`);}

function dynamicChoices(type,value){let items=[];if(type==='player')items=state.players.filter(p=>p.status==='Active').map(p=>[p.id,`${p.number||'—'} · ${playerDisplayName(p)}${p.status!=='Active'?' ('+t(p.status)+')':''}`]);if(type==='fixture')items=state.fixtures.map(f=>[f.id,`R${f.round} · ${f.opponent} · ${t(f.homeAway)}`]);if(type==='item')items=state.equipment.map(i=>[i.id,`${i.name} ${i.spec||''} · 가용 ${equipmentAvailable(i)}`]);if(type==='trip')items=state.trips.map(tr=>{const f=state.fixtures.find(f=>f.id===tr.fixtureId);return [tr.id,`${tr.departureDate||'미입력'} · ${f?.opponent||'미지정'}`]});return `<option value="">선택하세요</option>`+items.map(([id,label])=>`<option value="${esc(id)}" ${String(value)===String(id)?'selected':''}>${esc(label)}</option>`).join('');}
function recordField(f,value,required){if(f[2]==='player'&&value&&getPlayer(value)?.status!=='Active')return `<div class="field"><label>${f[1]}</label><input type="hidden" name="${f[0]}" value="${esc(value)}"><input value="${esc(playerLabel(value))}" readonly aria-label="보관된 선수 기록"><span class="help">보관된 기록의 선수는 유지됩니다.</span></div>`;if(['player','fixture','item','trip'].includes(f[2]))return `<div class="field"><label for="f-${f[0]}">${f[1]}${required?' <span>*</span>':''}</label><select name="${f[0]}" id="f-${f[0]}" ${required?'required':''}>${dynamicChoices(f[2],value)}</select></div>`;return fieldHtml(f,value,required,f[0]==='rpe'?'min="1" max="10" step="1"':['round','qty','total','damaged','reorderLevel','minutes','goals','assists','yellow','red'].includes(f[0])?'step="1"':'');}
function openRecord(type,id='',prefill={}){if(type==='fixtures')return openCatalogFixture(id,prefill);const c=recordConfigs[type];if(!c)return;const item=id?state[c.key].find(r=>r.id===id):{...c.defaults,...prefill};if(!item)return;let note=type==='moves'&&item.auto?notice('선수 관리에서 자동 생성한 기록입니다. 수정해도 당시 변경 전·후 상세 내역은 유지됩니다.')+changeDescription(item):type==='matchLogs'?`<div class="notice amber">${icon('info')}原본의 경기별 기록은 비어 있고 시즌 누적 기록만 있습니다. 이미 누적에 포함된 경기는 ‘시즌 합계에 더하기’를 해제해 주세요. 선수별 원본 누적 기준 라운드는 시즌 기록에서 확인할 수 있습니다.</div>`:type==='documents'?`<div class="notice">${icon('info')}문서 종류와 보관 위치를 기록합니다. 실제 문서 파일은 별도로 보관해 주세요.</div>`:'';note=note.replace('原본','원본');modal((id?'수정: ':'추가: ')+c.title,`<form id="record-form" data-type="${type}" data-id="${esc(id)}"><div class="dialogbody">${note}<div class="formerror" id="form-error" role="alert"></div><div class="formgrid">${c.fields.map(f=>recordField(f,item[f[0]]??'',c.required.includes(f[0]))).join('')}</div></div><div class="dialogfoot">${id?btn('기록 삭제','delete-record','trash',`data-type="${type}" data-id="${esc(id)}"`,'danger'):''}${btn('취소','close-dialog','close')}<button class="btn primary" type="submit">${icon('save')}기록 저장</button></div></form>`);}
function recordButton(type,label='기록 추가'){return btn(label,'new-record','plus',`data-type="${type}"`,'primary')}
function editRecordButton(type,id){return `<button class="iconbtn no-print" data-action="edit-record" data-type="${type}" data-id="${esc(id)}" aria-label="기록 수정">${icon('edit')}</button>`}
function simpleTable(headers,rows,emptyTitle='등록된 기록이 없습니다.',desc='기록을 추가하면 이곳에 표시됩니다.'){return `<div class="table-scroll"><table><thead><tr>${tableSortHead(headers)}</tr></thead><tbody>${rows.join('')}</tbody></table></div>${rows.length?'':empty(emptyTitle,desc)}`;}
function tabsHtml(tabs,current){return `<div class="tabs" role="tablist">${tabs.map(([id,label,n])=>`<button class="tab ${current===id?'active':''}" role="tab" aria-selected="${current===id}" data-action="subtab" data-tab="${id}">${label}${n!=null?`<span class="tabcount">${n}</span>`:''}</button>`).join('')}</div>`}
function notice(text,amber=false){return `<div class="notice ${amber?'amber':''}">${icon('info')}<span>${text}</span></div>`}
function renderStats(){const ps=[...state.players].sort((a,b)=>statsFor(b.id).goals-statsFor(a.id).goals||statsFor(b.id).apps-statsFor(a.id).apps);const total=key=>ps.reduce((a,p)=>a+statsFor(p.id)[key],0);return head('시즌 기록','2026/27 시즌 · 선수별 누적 출전 및 경기 기록',btn('기록 내보내기','csv','download')+btn('선수 경기 기록 일괄 입력','batch-logs','list','','primary'))+`<div class="summary">${statCard('누적 득점',total('goals'),'골','전체 등록 선수 기준','chart')}${statCard('누적 도움',total('assists'),'개','원본 + 합산 대상 추가 기록','chart','blue')}${statCard('경기 MOM',total('motm'),'회','원본 수상 포함','award')}${statCard('선수 경기 기록',state.matchLogs.length,'개','이 HTML에서 추가한 경기별 기록','file')}</div>`+notice('원본 시즌 누적 기록을 유지하고 합산 대상으로 지정한 새 기록만 더합니다. 원본의 경기별 출전 기록과 출전시간은 비어 있어 누적 출전시간이 0으로 표시됩니다.')+`<section class="panel"><div class="panelhead"><h2>선수별 기록</h2><span class="tiny">기준 R = 원본 누적 마지막 라운드</span></div>${simpleTable(['선수','포지션','상태','출전','선발','교체','득점','도움','경고','퇴장','MOM','POTM','GOTM','시간(분)','기준 R'],ps.map(p=>{const s=statsFor(p.id);return `<tr><td>${namecell(p)}</td><td><span class="position">${esc(p.position)}</span></td><td>${badge(p.status)}</td>${['apps','starts','subs','goals','assists','yellow','red','motm','potm','gotm','minutes','lastRound'].map(k=>`<td class="numeric">${s[k]||0}</td>`).join('')}</tr>`}))}</section>`;}
function result(f){return f.gf==null||f.ga==null?'':Number(f.gf)>Number(f.ga)?'W':Number(f.gf)<Number(f.ga)?'L':'D'}

function documentStatus(r){if(!r.expiryDate)return ['만료일 미입력',''];const days=Math.ceil((Date.parse(r.expiryDate+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/86400000);return days<0?['만료','red']:days<=30?[`${days}일 후 만료`,'amber']:['유효','green'];}

function openBatchLogs(id=''){if(!state.fixtures.length)return toast('경기 일정을 먼저 등록해 주세요.',true);const fixtureId=id||state.fixtures[0].id;logsBatch={fixtureId,entries:logBatchEntries(fixtureId)};modal('선수 경기 기록 일괄 입력',`<form id="batch-log-form"><div class="dialogbody batch-body">${notice('원본 시즌 누적에 이미 포함된 경기는 시즌 합산을 해제하세요. 기존 선수 기록은 중복 생성하지 않고 같은 경기의 기록을 수정합니다.',true)}<div class="formerror" id="form-error" role="alert"></div><div class="bulk-top"><div class="field fixture-picker"><label for="batch-log-fixture">경기 선택</label><select id="batch-log-fixture" required>${dynamicChoices('fixture',fixtureId)}</select></div><span class="tiny">선택한 선수만 저장합니다. 기존 기록 삭제는 개별 수정에서 할 수 있습니다.</span></div><div class="batch-toolbar"><button type="button" class="btn small" data-action="batch-select-all">현역 선수 전체 선택</button><button type="button" class="btn small" data-action="batch-select-none">선택 해제</button><select id="batch-apply-status" aria-label="일괄 출전 상태"><option value="">출전 상태 유지</option>${opt(['Starter','Sub','Unused'],'')}</select><input id="batch-apply-minutes" type="number" min="0" step="1" placeholder="시간(분)" aria-label="일괄 출전시간"><select id="batch-apply-stats" aria-label="일괄 시즌 합산"><option value="keep">시즌 합산 유지</option><option value="include">시즌 합산</option><option value="exclude">합산 제외</option></select>${btn('선택 선수에 적용','batch-apply','check','','small light')}<span class="batch-count" id="batch-log-count"></span></div><div class="table-scroll batch-table"><table><thead><tr>${['선택','선수','출전 상태','포지션','시간(분)','득점','도움','경고','퇴장','주장','MOM','합산','비고'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody id="batch-log-rows">${batchLogsRows()}</tbody></table></div></div><div class="dialogfoot">${btn('취소','close-dialog','close')}<button type="submit" class="btn primary">${icon('save')}선택 선수 기록 일괄 저장</button></div></form>`);document.querySelector('#dialog').classList.add('wide-dialog');refreshLogCount();}

function prepareBatchLogs(fixtureId,entries){if(!state.fixtures.some(f=>f.id===fixtureId))throw Error('경기를 선택해 주세요.');const selected=entries.filter(r=>r.selected);if(!selected.length)throw Error('저장할 선수를 선택해 주세요.');const seen=new Set(),records=[];for(const r of selected){const p=getPlayer(r.playerId),old=state.matchLogs.find(l=>l.fixtureId===fixtureId&&l.playerId===r.playerId);if(!p||p.status!=='Active'&&!old)throw Error('선수를 다시 선택해 주세요.');if(seen.has(r.playerId))throw Error('같은 선수의 경기 기록이 중복되었습니다.');seen.add(r.playerId);if(!['Starter','Sub','Unused'].includes(r.status)||!['GK','DF','MF','FW'].includes(r.matchPosition))throw Error('출전 상태와 포지션을 확인해 주세요.');const o={...old,id:old?.id||uid('MAT'),fixtureId,playerId:r.playerId,playerName:p.name,status:r.status,matchPosition:r.matchPosition,notes:String(r.notes||'').trim()};for(const k of ['minutes','goals','assists','yellow','red']){const n=Number(r[k]);if(!Number.isInteger(n)||n<0)throw Error('시간·득점·도움·카드는 0 이상의 정수로 입력해 주세요.');o[k]=n;}for(const k of ['captain','motm','includeInStats'])o[k]=!!r[k];if(o.status==='Unused'&&(o.minutes||o.goals||o.assists))throw Error('벤치 미사용 선수의 시간·득점·도움은 0으로 입력해 주세요.');records.push(o);}return records;}
function submitBatchLogs(){let records;try{records=prepareBatchLogs(logsBatch.fixtureId,logsBatch.entries);}catch(e){return formError(e.message);}undoState=clone(state);for(const o of records){const index=state.matchLogs.findIndex(l=>l.fixtureId===o.fixtureId&&l.playerId===o.playerId);if(index<0)state.matchLogs.push(o);else state.matchLogs[index]=o;}save();closeDialog();render();toast('선수 경기 기록을 일괄 저장했습니다.');}
function parseDelimited(text){const source=text.replace(/^\uFEFF/,'').trim(),delimiter=source.split(/\r?\n/)[0]?.includes('\t')?'\t':',';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<source.length;i++){const c=source[i];if(c==='"'){if(quoted&&source[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(!quoted&&c===delimiter){row.push(cell.trim());cell='';}else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&source[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('붙여넣은 표의 따옴표를 확인해 주세요.');row.push(cell.trim());if(row.some(Boolean))rows.push(row);return rows;}
function normalizeFixtureDate(value){const v=String(value||'').trim();if(!v)return '';const m=v.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})(?:\s.*)?$/);const date=m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:v;if(!validDay(date))throw Error('경기 날짜 형식을 확인해 주세요.');return date;}
function parseFixtureText(text,competition){const rows=parseDelimited(text);if(!rows.length)throw Error('일정을 붙여넣어 주세요.');let mapping=['round','date','opponent','homeAway','venue','kickoffTime','competition','notes'];if(!/^R?\d+$/i.test(rows[0][0])){mapping=rows.shift().map(v=>{const k=v.toLowerCase();if(/round|라운드/.test(k))return 'round';if(/opponent|상대/.test(k))return 'opponent';if(/home|away|h\s*\/\s*a|홈|원정/.test(k))return 'homeAway';if(/venue|ground|경기장/.test(k))return 'venue';if(/competition|대회/.test(k))return 'competition';if(/time|시간|킥오프/.test(k))return 'kickoffTime';if(/date|경기일|날짜|일자/.test(k))return 'date';if(/note|비고/.test(k))return 'notes';return '';});if(!mapping.includes('round')||!mapping.includes('opponent'))throw Error('라운드와 상대팀 열을 확인해 주세요.');}const parsed=rows.map(row=>{const o={competition,homeAway:'Home',date:'',kickoffTime:'',venue:'',notes:''};mapping.forEach((k,i)=>{if(k&&row[i]!==undefined)o[k]=row[i];});o.round=Number(String(o.round||'').replace(/^r/i,''));o.date=normalizeFixtureDate(o.date);const ha=String(o.homeAway||'Home').toLowerCase();if(/^(home|h|홈)$/.test(ha))o.homeAway='Home';else if(/^(away|a|원정)$/.test(ha))o.homeAway='Away';else throw Error('홈·원정은 Home/Away 또는 홈/원정으로 입력해 주세요.');o.competition=o.competition||competition;return o;});const seen=new Set();for(const r of parsed){const key=competitionKey(r.competition)+'|'+r.round;if(seen.has(key))throw Error('같은 대회의 라운드가 중복되었습니다.');seen.add(key);}return parsed;}
function fixtureBatchRow(f={}){return {id:f.id||'',round:f.round||'',date:f.date||'',kickoffTime:f.kickoffTime||'',competition:f.competition||defaultCompetition()?.name||'NRFA League One',opponent:f.opponent||'',homeAway:f.homeAway||'Home',venue:f.venue||'',notes:f.notes||''};}
function ensureFixtureRounds(last,competition){if(!Number.isInteger(last)||last<1||last>200)throw Error('마지막 라운드는 1~200 사이로 입력해 주세요.');fixturesBatch.rows=fixturesBatch.rows.filter(r=>r.id||r.opponent||Number(r.round)<=last);for(let n=1;n<=last;n++)if(!fixturesBatch.rows.some(r=>Number(r.round)===n&&competitionKey(r.competition)===competitionKey(competition)))fixturesBatch.rows.push(fixtureBatchRow({round:n,competition}));fixturesBatch.rows.sort((a,b)=>a.round-b.round);}
function fixtureBatchRows(){return fixturesBatch.rows.map((r,i)=>`<tr><td><input type="number" min="1" step="1" data-fixture-row="${i}" data-fixture-key="round" aria-label="라운드" value="${esc(r.round)}"></td><td><input type="date" data-fixture-row="${i}" data-fixture-key="date" aria-label="경기일" value="${esc(r.date)}"></td><td><input type="time" data-fixture-row="${i}" data-fixture-key="kickoffTime" aria-label="경기시간" value="${esc(r.kickoffTime)}"></td><td><input type="text" maxlength="250" list="bulk-teams-${i}" data-fixture-row="${i}" data-fixture-key="opponent" aria-label="상대팀" value="${esc(r.opponent)}">${fixtureCatalogChoices(r.competition,i)}</td><td><select data-fixture-row="${i}" data-fixture-key="homeAway" aria-label="홈·원정">${opt(['Home','Away'],r.homeAway)}</select></td><td><input type="text" maxlength="250" list="bulk-venues" data-fixture-row="${i}" data-fixture-key="venue" aria-label="경기장" value="${esc(r.venue)}"></td><td><input type="text" maxlength="250" list="bulk-competitions" data-fixture-row="${i}" data-fixture-key="competition" aria-label="대회" value="${esc(r.competition)}"></td><td>${r.id?badge('기존 경기'):btn('제거','drop-fixture-row','trash',`data-row="${i}"`,'small')}</td></tr>`).join('');}
function openSeasonFixtures(){const defaultName=defaultCompetition()?.name||'NRFA League One';fixturesBatch={rows:state.fixtures.map(fixtureBatchRow)};ensureFixtureRounds(Math.max(30,...state.fixtures.map(f=>f.round)),defaultName);modal('시즌 경기 일정 일괄 입력',`<form id="season-fixture-form"><div class="dialogbody batch-body">${notice('상대팀이 있는 행만 저장합니다. 기존 경기는 경기 ID를 유지하므로 결과·선수 기록·경기 명단이 보존됩니다.')}<div class="formerror" id="form-error" role="alert"></div><div class="batch-toolbar"><label><span>시즌</span><b>2026 / 27</b></label><label for="bulk-competition">기본 대회</label><select id="bulk-competition">${competitionOptions(defaultName)}</select><label for="bulk-last-round">마지막 라운드</label><input id="bulk-last-round" type="number" min="1" max="200" step="1" value="${Math.max(30,...state.fixtures.map(f=>f.round))}">${btn('라운드 행 만들기','generate-fixture-rows','list','','small')}${btn('행 추가','add-fixture-row','plus','','small light')}</div><details class="paste-box"><summary>엑셀·CSV에서 복사해 붙여넣기</summary><p class="smallnote">열 순서: 라운드, 경기일, 상대팀, 홈·원정, 경기장, 시간, 대회. 열 제목이 있으면 순서를 자동으로 인식합니다. 날짜는 YYYY-MM-DD로 입력하세요.</p><textarea id="fixture-paste" aria-label="시즌 일정 붙여넣기" placeholder="13&#9;2026-10-02&#9;Opponent FC&#9;Home&#9;Ground&#9;15:00"></textarea>${btn('표에 반영','parse-fixture-paste','list','','small light')}</details><datalist id="bulk-venues">${state.venues.filter(v=>v.active).map(v=>`<option value="${esc(v.name)}">${esc(v.koreanName)}</option>`).join('')}</datalist><datalist id="bulk-competitions">${state.competitions.filter(c=>c.active&&c.participating).map(c=>`<option value="${esc(c.name)}">${esc(c.koreanName)}</option>`).join('')}</datalist><p class="smallnote">등록한 상대팀을 선택하고 홈·원정을 바꾸면 경기장이 자동 적용됩니다. 입력된 경기장은 직접 수정할 수 있습니다.</p><div class="table-scroll fixture-batch-table"><table><thead><tr>${['라운드','경기일','시간 (CAT)','상대팀','홈·원정','경기장','대회','입력 행'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody id="fixture-batch-rows">${fixtureBatchRows()}</tbody></table></div></div><div class= function prepareFixtureBatch(rows){const updates=[],seen=new Set();for(const row of rows){if(!String(row.opponent||'').trim()){if(row.id)throw Error('기존 경기의 상대팀을 비울 수 없습니다.');continue;}const round=Number(row.round),competition=String(row.competition||'').trim();if(!Number.isInteger(round)||round<1)throw Error('라운드는 1 이상의 정수로 입력해 주세요.');if(!competition)throw Error('대회를 입력해 주세요.');if(!validDay(row.date))throw Error('경기 날짜 형식을 확인해 주세요.');if(row.kickoffTime&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(row.kickoffTime))throw Error('경기시간을 확인해 주세요.');if(!['Home','Away'].includes(row.homeAway))throw Error('홈·원정을 확인해 주세요.');const key=competitionKey(competition)+'|'+round;if(seen.has(key))throw Error('같은 대회의 라운드가 중복되었습니다.');seen.add(key);const old=row.id?state.fixtures.find(f=>f.id===row.id):null;if(row.id&&!old)throw Error('기존 경기를 다시 확인해 주세요.');updates.push(linkFixtureCatalog({...old,...row,id:old?.id||uid('FX'),round,competition,opponent:String(row.opponent).trim(),date:row.date||'',gf:old?.gf??null,ga:old?.ga??null,formation:old?.formation||'4-2-3-1',scheduleStatus:old?.scheduleStatus||'Scheduled'}));}if(!updates.length)throw Error('저장할 경기의 상대팀을 입력해 주세요.');const edited=new Set(updates.map(f=>f.id)),all=[...state.fixtures.filter(f=>!edited.has(f.id)),...updates],keys=new Set();for(const f of all){const key=competitionKey(f.competition)+'|'+f.round;if(keys.has(key))throw Error('같은 대회의 라운드가 이미 등록되어 있습니다.');keys.add(key);}return updates;}
function submitSeasonFixtures(){let updates;try{updates=prepareFixtureBatch(fixturesBatch.rows);}catch(e){return formError(e.message);}undoState=clone(state);for(const f of updates){const index=state.fixtures.findIndex(x=>x.id===f.id);if(index<0)state.fixtures.push(f);else {const old=state.fixtures[index];if((old.date||'')!==f.date||(old.kickoffTime||'')!==f.kickoffTime){const date=f.date,time=f.kickoffTime;f.date=old.date||'';f.kickoffTime=old.kickoffTime||'';scheduleChange(f,'Date Updated',date,'시즌 일정 일괄 수정',time);}state.fixtures[index]=f;}}save();closeDialog();render();toast('시즌 경기 일정을 일괄 저장했습니다.');}
function workflowInput(el){if(el.dataset.logRow!==undefined&&logsBatch){const r=logsBatch.entries[Number(el.dataset.logRow)],key=el.dataset.logKey;r[key]=el.type==='checkbox'?el.checked:el.type==='number'?el.value:el.value;if(key==='selected'){el.closest('tr').classList.toggle('row-disabled',!el.checked);for(const input of el.closest('tr').querySelectorAll('input,select'))if(input!==el)input.disabled=!el.checked;refreshLogCount();}return true;}if(el.dataset.fixtureRow!==undefined&&fixturesBatch){fixturesBatch.rows[Number(el.dataset.fixtureRow)][el.dataset.fixtureKey]=el.value;return true;}return false;}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;try{if(a==='sort-players'){sortDir=sort===b.dataset.key?(sortDir==='asc'?'desc':'asc'):['apps','goals'].includes(b.dataset.key)?'desc':'asc';sort=b.dataset.key;page=1;render();}else if(a==='batch-logs')openBatchLogs(id);else if(a==='match-result')openMatchResult(id);else if(a==='season-fixtures')openSeasonFixtures();else if(a==='postpone'||a==='reschedule')openScheduleChange(id,a);else if(a==='schedule-history')openScheduleHistory(id);else if(a==='batch-select-all'||a==='batch-select-none'){for(const r of logsBatch.entries)r.selected=a==='batch-select-all'&&getPlayer(r.playerId)?.status==='Active';redrawLogRows();}else if(a==='batch-apply'){const status=document.querySelector('#batch-apply-status').value,minutes=document.querySelector('#batch-apply-minutes').value,stats=document.querySelector('#batch-apply-stats').value;for(const r of logsBatch.entries.filter(r=>r.selected)){if(status)r.status=status;if(minutes!=='')r.minutes=minutes;if(stats!=='keep')r.includeInStats=stats==='include';}redrawLogRows();}else if(a==='generate-fixture-rows'){ensureFixtureRounds(Number(document.querySelector('#bulk-last-round').value),document.querySelector('#bulk-competition').value.trim()||'NRFA League One');redrawFixtureBatch();}else if(a==='add-fixture-row'){fixturesBatch.rows.push(fixtureBatchRow({round:Math.max(0,...fixturesBatch.rows.map(r=>Number(r.round)||0))+1,competition:document.querySelector('#bulk-competition').value.trim()||'NRFA League One'}));redrawFixtureBatch();}else if(a==='drop-fixture-row'){if(!fixturesBatch.rows[Number(b.dataset.row)].id)fixturesBatch.rows.splice(Number(b.dataset.row),1);redrawFixtureBatch();}else if(a==='parse-fixture-paste'){const imported=parseFixtureText(document.querySelector('#fixture-paste').value,document.querySelector('#bulk-competition').value.trim()||'NRFA League One');const staged=clone(fixturesBatch.rows);for(const row of imported){const index=staged.findIndex(r=>Number(r.round)===row.round&&competitionKey(r.competition)===competitionKey(row.competition));if(index<0)staged.push(fixtureBatchRow(row));else staged[index]={...staged[index],...row};}prepareFixtureBatch(staged);fixturesBatch.rows=staged.sort((a,b)=>a.round-b.round);redrawFixtureBatch();document.querySelector('#form-error').textContent='';toast('붙여넣은 일정을 표에 반영했습니다. 내용을 확인한 뒤 저장하세요.');}}catch(err){formError(err.message);}});

// Sort displayed rows without changing saved records or input row identities.
const tableSortStates=new Map();
const unsortableHeaders=new Set(['관리','입력 행']);
function tableSortHead(headers){return headers.map((label,index)=>unsortableHeaders.has(label)?`<th>${esc(label)}</th>`:`<th data-sort-label="${esc(label)}" aria-sort="none"><button type="button" class="sorthead" data-action="sort-table" data-column="${index}"><span>${esc(label)}</span><span class="sort-mark" aria-hidden="true">↕</span></button></th>`).join('');}
function tableContextKey(table){const headers=Array.from(table.tHead?.rows[0]?.cells||[]).map(th=>th.dataset.sortLabel||canonicalTableText(th));const dialog=table.closest('dialog'),form=table.closest('form');return JSON.stringify([view,dialog?'dialog':'page',form?.id||'',headers]);}
function tableValueKind(label){if(/^(등번호|라운드|기준 R|출전|선발|교체|득점|도움|경고|퇴장|MOM|POTM|GOTM|시간\(분\)|시간 \(CAT\)|선수 기록|기록 수|총수량|지급중|파손·분실|가용|수량|인원|RPE|비용\(MWK\)|지급\(MWK\)|미지급\(MWK\))$/.test(label))return label==='시간 (CAT)'?'time':'number';if(/일자|기록일|경기일|이전 경기일|새 경기일|훈련일|발급일|만료일|입사일|퇴직일|시작일|종료일|출발일|복귀일|지급일|반납 예정|계약 기간/.test(label))return 'date';if(/시간$/.test(label))return 'time';if(label==='스코어')return 'score';if(label==='선택'||label==='주장'||label==='합산')return 'boolean';return 'text';}
function canonicalTableText(node){if(node.nodeType===3)return originalTexts.get(node)??node.nodeValue??'';if(node.nodeType!==1||node.matches('.subtext,.leadership,.avatar,.sort-mark,datalist,script,style'))return '';return Array.from(node.childNodes).map(canonicalTableText).join(' ').trim();}
function tableCellValue(cell){if(!cell)return '';if(cell.dataset.sortValue!==undefined)return cell.dataset.sortValue;const control=cell.querySelector('input:not([type=hidden]),select,textarea');if(control){if(control.type==='checkbox')return control.checked?'1':'0';if(control.tagName==='SELECT'){const option=control.selectedOptions[0];return option?canonicalTableText(option):control.value;}return control.value;}const name=cell.querySelector('.playername');if(name)return canonicalTableText(name);let primary=canonicalTableText(cell);const date=primary.match(/\d{4}-\d{2}-\d{2}/)?.[0];if(date&&cell.querySelector('.subtext')){const time=cell.querySelector('.subtext')?.textContent.match(/\b\d{2}:\d{2}\b/)?.[0];primary=date+(time?' '+time:'');}return primary.replace(/\s+/g,' ').trim();}
function normalizedTableValue(value,kind='text'){const raw=String(value??'').trim().replace(/\s+/g,' '),empty=!raw||/^(—|-|미입력|미정|미지정|재편성 대기|Not entered|Not specified|TBD|Awaiting rescheduling)$/i.test(raw);if(empty)return {empty:true,value:null};if(kind==='number'){const cleaned=raw.replace(/,/g,'').replace(/^R\s*/i,''),number=Number(cleaned);if(cleaned!==''&&Number.isFinite(number))return {empty:false,value:number};}if(kind==='boolean'){if(['1','C','확인','있음','합산','Yes','Included'].includes(raw))return {empty:false,value:1};if(['0','미확인','없음','합산 제외','No','Excluded'].includes(raw))return {empty:false,value:0};}if(kind==='date'){const date=raw.match(/\d{4}-\d{2}-\d{2}/)?.[0];if(date){const time=raw.match(/\b\d{2}:\d{2}\b/)?.[0]||'00:00';return {empty:false,value:date+' '+time};}}if(kind==='score'){const score=raw.match(/^(\d+)\s*:\s*(\d+)$/);if(score)return {empty:false,value:[Number(score[1]),Number(score[2])]};}return {empty:false,value:tx(raw)};}
function compareTableValues(a,b,kind,dir='asc'){const av=normalizedTableValue(a,kind),bv=normalizedTableValue(b,kind);if(av.empty!==bv.empty)return av.empty?1:-1;if(av.empty)return 0;let diff;if(Array.isArray(av.value)&&Array.isArray(bv.value))diff=av.value[0]-bv.value[0]||av.value[1]-bv.value[1];else if(typeof av.value==='number'&&typeof bv.value==='number')diff=av.value-bv.value;else diff=String(av.value).localeCompare(String(bv.value),lang==='en'?'en':'ko',{numeric:true,sensitivity:'base'});return diff*(dir==='desc'?-1:1);}
function applyTableSort(table){const current=tableSortStates.get(table.dataset.sortKey);for(const th of Array.from(table.tHead?.rows[0]?.cells||[])){const button=th.querySelector('[data-action="sort-table"]');if(!button)continue;const active=current?.column===Number(button.dataset.column);th.setAttribute('aria-sort',active?(current.dir==='asc'?'ascending':'descending'):'none');button.querySelector('.sort-mark').textContent=active?(current.dir==='asc'?'▲':'▼'):'↕';}if(!current||!table.tBodies[0])return;const kind=tableValueKind(table.tHead.rows[0].cells[current.column].dataset.sortLabel),tbody=table.tBodies[0],rows=Array.from(tbody.rows);rows.forEach((row,index)=>{if(row.dataset.tableOrder===undefined)row.dataset.tableOrder=String(index);});rows.sort((a,b)=>compareTableValues(tableCellValue(a.cells[current.column]),tableCellValue(b.cells[current.column]),kind,current.dir)||Number(a.dataset.tableOrder)-Number(b.dataset.tableOrder));const fragment=document.createDocumentFragment();for(const row of rows)fragment.append(row);tbody.append(fragment);}
function enhanceTableSorting(root=document.body){const tables=root.matches?.('table')?[root]:Array.from(root.querySelectorAll('table'));for(const table of tables){if(!table.tHead||table.querySelector('[data-action="sort-players"]'))continue;const row=table.tHead.rows[0];for(const [column,th] of Array.from(row.cells).entries()){if(th.querySelector('[data-action="sort-table"]'))continue;const label=canonicalTableText(th);if(unsortableHeaders.has(label))continue;th.dataset.sortLabel=label;th.innerHTML=tableSortHead([label]).replace('data-column="0"',`data-column="${column}"`).replace(/^<th[^>]*>|<\/th>$/g,'');th.setAttribute('aria-sort','none');const span=th.querySelector('.sorthead>span');span.textContent=tx(label);originalTexts.set(span.firstChild,label);}table.dataset.sortKey=tableContextKey(table);applyTableSort(table);}}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action="sort-table"]');if(!button)return;const table=button.closest('table'),column=Number(button.dataset.column),old=tableSortStates.get(table.dataset.sortKey),dir=old?.column===column&&old.dir==='asc'?'desc':'asc';tableSortStates.set(table.dataset.sortKey,{column,dir});applyTableSort(table);});

const originalTexts=new WeakMap();
function tx(value){const s=String(value??''),key=s.trim();if(lang!=='en'||!key)return s;if(key.startsWith('· '))return s.replace(key,'· '+tx(key.slice(2)));let english=EN[key];if(english==null)for(const table of ['leagues','competitions','teams','venues']){const row=state[table]?.find(r=>r.koreanName===key);if(row){english=row.name;break;}}if(english==null&&key.includes(' · ')){const parts=key.split(' · '),translated=parts.map(part=>tx(part));if(parts.some((part,i)=>part!==translated[i]))english=translated.join(' · ');}if(english==null&&/^선택 \d+명$/.test(key))english=key.replace(/^선택 (\d+)명$/,'$1 selected');if(english==null){let m;if((m=key.match(/^총\s*(\d+)명$/)))english=`${m[1]} players`;else if((m=key.match(/^전체 등록\s*(\d+)명$/)))english=`${m[1]} players registered`;else if((m=key.match(/^가용 상태 미확인\s*(\d+)명$/)))english=`${m[1]} availability unknown`;else if((m=key.match(/^현역\s*(\d+)명$/)))english=`${m[1]} active players`;else if((m=key.match(/^(\d+)명 확인 필요$/)))english=`${m[1]} to review`;else if((m=key.match(/^(\d+)명씩 보기$/)))english=`${m[1]} per page`;else if((m=key.match(/^(\d+)개$/)))english=`${m[1]} records`;else if((m=key.match(/^(\d+)명$/)))english=`${m[1]} players`;else if((m=key.match(/^(\d+)일 후 만료$/)))english=`Expires in ${m[1]} days`;else if((m=key.match(/^(\d+)경기 중$/)))english=`of ${m[1]} fixtures`;else if((m=key.match(/^(.+)을\(를\) 저장했습니다\.$/)))english=`${EN[m[1]]||m[1]} saved.`;else if((m=key.match(/^(.+)을\(를\) 입력해 주세요\.$/)))english=`Enter ${EN[m[1]]||m[1]}.`;else if((m=key.match(/^(.+)에 (0 이상의 숫자|정수)를 입력해 주세요\.$/)))english=`${EN[m[1]]||m[1]} must be ${m[2]==='정수'?'a whole number':'a non-negative number'}.`;else if((m=key.match(/^(.+)의 시작일이 종료일보다 늦습니다\.$/)))english=`${EN[m[1]]||m[1]}: the start date is later than the end date.`;else if((m=key.match(/^(추가|수정): (.+)$/)))english=`${m[1]==='추가'?'Add':'Edit'}: ${EN[m[2]]||m[2]}`;else if((m=key.match(/^(.+) 추가$/))&&EN[m[1]])english=`Add ${EN[m[1]].toLowerCase()}`;else if((m=key.match(/^(\d+)–(\d+) \/ (\d+)명$/)))english=`${m[1]}–${m[2]} / ${m[3]} players`;else if((m=key.match(/^(\d+)페이지$/)))english=`Page ${m[1]}`;else if(key==='0명')english='0 players';else if((m=key.match(/^최근 저장 (.+)$/)))english=`Last saved ${m[1]}`;else if((m=key.match(/^원본: (.+)$/)))english=`Source: ${m[1]}`;else if((m=key.match(/^원본 엑셀 기준 (.+)$/)))english=`Workbook snapshot ${m[1]}`;else if((m=key.match(/^훈련 기록 (\d+)개 · 문서 (\d+)개 · 수상 (\d+)개$/)))english=`${m[1]} training records · ${m[2]} documents · ${m[3]} awards`;else if((m=key.match(/^선수 (\d+)명 · 경기 (\d+)개 · 훈련 (\d+)개$/)))english=`${m[1]} players · ${m[2]} fixtures · ${m[3]} training records`;else if((m=key.match(/^주장 (.+) · 부주장 (.+)$/)))english=`Captain ${m[1]} · Vice captain ${m[2]}`;else if((m=key.match(/^(.+) 기록을 삭제합니다\. 삭제 직전 데이터는 ‘데이터 백업’에서 한 번 되돌릴 수 있습니다\.$/)))english=`Delete this ${EN[m[1]]||m[1]} record. You can undo the deletion once in Data backup.`;else if(key==='이미 반영된 선수 상태는 선수 정보에서 별도로 수정해 주세요.')english='Update any player status already applied separately in player information.';else if((m=key.match(/^백업을 불러오지 못했습니다\. (.+)$/)))english='Could not restore the backup. '+tx(m[1]);else if(key.startsWith('가용 상태 확인: '))english=key.replace('가용 상태 확인: ','Availability to review: ').replace(/\(([^)]+)\)/g,(_,s)=>'('+tx(s)+')');else if((m=key.match(/^Round \/ 라운드 (\d+)$/)))english=`Round ${m[1]}`;else if(key.includes('NRFA 리그 원'))english=key.replace('NRFA League One / NRFA 리그 원','NRFA League One');else if(key.includes(' · 원본 엑셀 기준 '))english=key.replace(' · 원본 엑셀 기준 ',' · Workbook snapshot ');else if(key.includes(' · 경기 명단'))english=key.replace(' · 경기 명단',' · Matchday squad');else if(key.includes('일자 미입력'))english=key.replace('일자 미입력','Date not entered');}
if(english==null)return s;return s.slice(0,s.indexOf(key))+english+s.slice(s.indexOf(key)+key.length);}
function translateUI(root=document.body){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walker.nextNode()){const n=walker.currentNode;if(n.parentElement?.closest('script,style,textarea'))continue;const original=originalTexts.get(n)??n.nodeValue;originalTexts.set(n,original);n.nodeValue=lang==='en'?tx(original):original;}for(const el of root.querySelectorAll('[placeholder],[title],[aria-label]')){for(const a of ['placeholder','title','aria-label']){if(!el.hasAttribute(a))continue;const attr='data-original-'+a;if(!el.hasAttribute(attr))el.setAttribute(attr,el.getAttribute(a));const original=el.getAttribute(attr);let result=tx(original);if(lang==='en'){result=result.replace(' 정보 수정',' — edit player').replace(' 서류 상태 수정',' — edit document status').replace(' 명단 선택',' — select for squad').replace(' 경기 역할',' — match role');}el.setAttribute(a,lang==='en'?result:original);}}
for(const unit of root.querySelectorAll('[data-personnel-unit]'))unit.textContent=lang==='en'?(parseInt(unit.parentElement.textContent,10)===1?' person':' people'):'명';
enhanceTableSorting(root);
document.documentElement.lang=lang;document.title=lang==='en'?'CHIZUMULU UNITED FC · Player management':'CHIZUMULU UNITED FC · 통합 선수 관리';for(const toggle of document.querySelectorAll('.language-toggle')){toggle.textContent=lang==='en'?'한국어':'EN';toggle.setAttribute('aria-label',lang==='en'?'한국어로 전환':'Switch to English');}if(CLOUD_SITE)updateSaveStatus();else document.querySelector('#save-status').textContent=tx(storageOK?'이 기기에 자동 저장':'백업 파일로 저장 필요');}
function switchLanguage(){lang=lang==='ko'?'en':'ko';try{localStorage.setItem(STORE+'-language',lang)}catch(e){}translateUI();}

// Upgrade earlier saved data once while retaining user photos and all club records.
function applyBundledPlayerPhotos(data){const version=SEED.meta.bundledPhotoVersion;if(!version||data.meta.bundledPhotoVersion===version)return false;const sources=new Map(SEED.players.filter(p=>p.photo).map(p=>[p.id,p]));for(const player of data.players){const source=sources.get(player.id);if(source&&String(source.name).trim().toLowerCase()===String(player.name).trim().toLowerCase()&&!player.photo)player.photo=source.photo;}data.meta.bundledPhotoVersion=version;data.meta.bundledPhotoSource=SEED.meta.bundledPhotoSource;return true;}

// Apply verified reference information once to earlier backups and saved data.
function applyBundledPlayerInformation(data){const version=SEED.meta.bundledPlayerInfoVersion;if(!version||data.meta.bundledPlayerInfoVersion===version)return false;const sources=new Map(SEED.players.map(p=>[p.id,p]));for(const player of data.players){const source=sources.get(player.id);if(!source||String(source.name).trim().toLowerCase()!==String(player.name).trim().toLowerCase())continue;if(source.birthDate&&!player.birthDate)player.birthDate=source.birthDate;if(source.id==='CU26-001'&&source.contractType==='Temporary')player.contractType='Temporary';}data.meta.bundledPlayerInfoVersion=version;return true;}


function applyBundledGiftRejoin(data){return false;}


function applyBundledJoinDates(data){return false;}

function contractDateMode(player){if(['join','manual'].includes(player.contractStartMode))return player.contractStartMode;const join=player.joinDate||'',start=player.contractStart||'',end=player.contractEnd||'';return (!start||start===join)&&(!join||!end||join<=end)?'join':'manual';}
function initializePlayerContractDates(player){const beforeMode=player.contractStartMode,beforeDate=player.contractStart;let mode=contractDateMode(player);if(mode==='join'&&player.joinDate&&player.contractEnd&&player.joinDate>player.contractEnd)mode='manual';player.contractStartMode=mode;if(mode==='join')player.contractStart=player.joinDate||'';return beforeMode!==mode||beforeDate!==player.contractStart;}
function initializeContractDates(data){let changed=false;for(const player of data.players)if(initializePlayerContractDates(player))changed=true;return changed;}
function playerContractStartField(player){return `<div class="field contract-date-field"><label for="f-contractStart">계약 시작일</label><input id="f-contractStart" name="contractStart" type="date" value="${esc(player.contractStart||'')}"><label class="contract-sync-control" for="contract-start-sync"><input id="contract-start-sync" name="contractStartSync" type="checkbox" ${contractDateMode(player)==='join'?'checked':''}><span>입단일과 동기화</span></label><span class="help">다른 날짜로 직접 수정하면 동기화가 해제됩니다.</span></div>`;}
function applyContractDateForm(form,player){const sync=form.elements.namedItem('contractStartSync');player.contractStartMode=sync?.checked?'join':'manual';if(player.contractStartMode==='join')player.contractStart=player.joinDate||'';}
function handleContractDateInput(event){const field=event.target,form=field.closest?.('#player-form');if(!form)return;const join=form.elements.namedItem('joinDate'),start=form.elements.namedItem('contractStart'),sync=form.elements.namedItem('contractStartSync');if(!join||!start||!sync)return;if(field===join&&sync.checked)start.value=join.value;else if(field===start&&start.value!==join.value)sync.checked=false;else if(field===sync&&sync.checked)start.value=join.value;}
document.addEventListener('input',handleContractDateInput);
document.addEventListener('change',handleContractDateInput);

const upgradedPhotos=applyBundledPlayerPhotos(state),upgradedInformation=applyBundledPlayerInformation(state),upgradedRejoin=applyBundledGiftRejoin(state),upgradedJoins=applyBundledJoinDates(state),upgradedContractDates=initializeContractDates(state);
